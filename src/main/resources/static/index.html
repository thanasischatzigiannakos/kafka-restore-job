<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restore Engine</title>
  <style>
    :root {
      --bg: #f4f0e8;
      --panel: #fffaf2;
      --ink: #1d1c1a;
      --muted: #6b665d;
      --accent: #174c3c;
      --accent-2: #b85c38;
      --border: #d8cdbb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(184,92,56,0.12), transparent 32%),
        linear-gradient(135deg, #efe7d9, var(--bg));
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    h1, h2 {
      margin: 0 0 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    p { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(29, 28, 26, 0.08);
    }
    label, select, button, input {
      font: inherit;
    }
    select, input {
      width: 100%;
      margin: 8px 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    button.secondary {
      background: var(--accent-2);
    }
    button.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8f3ea;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      max-height: 380px;
      overflow: auto;
      font-size: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 8px;
      background: #ece3d5;
      color: var(--ink);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Restore Engine Console</h1>
    <p>Start restores, preview Kafka messages, monitor job lifecycle, and request cancellation.</p>

    <div class="grid">
      <section class="panel">
        <h2>Restore Actions</h2>
        <label for="restoreType">Restore type</label>
        <select id="restoreType">
          <option value="application">application</option>
          <option value="abuse">abuse</option>
        </select>
        <label for="restoreFromTimestamp">Restore from timestamp</label>
        <input id="restoreFromTimestamp" type="datetime-local">
        <button id="startRestore">Start restore</button>
        <button id="refreshJobs" class="ghost">Refresh jobs</button>
        <pre id="actionResult">No action yet.</pre>
      </section>

      <section class="panel">
        <h2>Message Preview</h2>
        <label for="previewTopic">Topic side</label>
        <select id="previewTopic">
          <option value="source">source</option>
          <option value="target">target</option>
        </select>
        <label for="previewLimit">Message limit</label>
        <input id="previewLimit" type="number" min="1" max="50" value="10">
        <button id="previewMessages" class="secondary">Preview messages</button>
        <pre id="previewResult">No preview loaded.</pre>
      </section>
    </div>

    <section class="panel" style="margin-top: 20px;">
      <h2>Jobs</h2>
      <table>
        <thead>
          <tr>
            <th>Job ID</th>
            <th>Restore Type</th>
            <th>Status</th>
            <th>Requested</th>
            <th>Restore From</th>
            <th>Started</th>
            <th>Completed</th>
            <th>Records</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobsBody"></tbody>
      </table>
    </section>
  </div>

  <script>
    const actionResult = document.getElementById("actionResult");
    const previewResult = document.getElementById("previewResult");
    const jobsBody = document.getElementById("jobsBody");

    async function jsonFetch(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || response.statusText);
      }
      return response.json();
    }

    async function loadJobs() {
      const jobs = await jsonFetch("/api/jobs");
      jobsBody.innerHTML = jobs.map(job => `
        <tr>
          <td>${job.id}</td>
          <td>${job.restoreType}</td>
          <td><span class="status">${job.status}</span></td>
          <td>${job.requestedAt || ""}</td>
          <td>${job.restoreFromTimestamp || ""}</td>
          <td>${job.startedAt || ""}</td>
          <td>${job.completedAt || ""}</td>
          <td>${job.recordsRestored ?? ""}</td>
          <td>
            <button class="ghost" onclick="cancelJob('${job.id}')">Cancel</button>
          </td>
        </tr>
      `).join("");
    }

    async function cancelJob(jobId) {
      try {
        const job = await jsonFetch(`/api/jobs/${jobId}/cancel`, { method: "POST" });
        actionResult.textContent = JSON.stringify(job, null, 2);
        await loadJobs();
      } catch (error) {
        actionResult.textContent = error.message;
      }
    }

    window.cancelJob = cancelJob;

    document.getElementById("startRestore").addEventListener("click", async () => {
      const restoreType = document.getElementById("restoreType").value;
      const restoreFromTimestampValue = document.getElementById("restoreFromTimestamp").value;
      const requestBody = { restoreType };
      if (restoreFromTimestampValue) {
        requestBody.restoreFromTimestamp = new Date(restoreFromTimestampValue).toISOString();
      }
      try {
        const job = await jsonFetch("/api/restores", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });
        actionResult.textContent = JSON.stringify(job, null, 2);
        await loadJobs();
      } catch (error) {
        actionResult.textContent = error.message;
      }
    });

    document.getElementById("previewMessages").addEventListener("click", async () => {
      const restoreType = document.getElementById("restoreType").value;
      const topic = document.getElementById("previewTopic").value;
      const limit = document.getElementById("previewLimit").value;
      try {
        const preview = await jsonFetch(`/api/pipelines/${restoreType}/messages?topic=${topic}&limit=${limit}`);
        previewResult.textContent = JSON.stringify(preview, null, 2);
      } catch (error) {
        previewResult.textContent = error.message;
      }
    });

    document.getElementById("refreshJobs").addEventListener("click", loadJobs);

    loadJobs();
    setInterval(loadJobs, 5000);
  </script>
</body>
</html>
