spring.application.name=kafka-restore-job
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/restore-engine;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

engine.kafka.bootstrap-servers=${ENGINE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
engine.kafka.source-bootstrap-servers=${ENGINE_KAFKA_SOURCE_BOOTSTRAP_SERVERS:}
engine.kafka.target-bootstrap-servers=${ENGINE_KAFKA_TARGET_BOOTSTRAP_SERVERS:}
engine.kafka.poll-timeout=${ENGINE_KAFKA_POLL_TIMEOUT:PT1S}
engine.kafka.transaction-timeout=${ENGINE_KAFKA_TRANSACTION_TIMEOUT:PT1M}
engine.kafka.request-timeout=${ENGINE_KAFKA_REQUEST_TIMEOUT:PT30S}
engine.kafka.delivery-timeout=${ENGINE_KAFKA_DELIVERY_TIMEOUT:PT2M}
engine.kafka.max-empty-polls-before-finish=${ENGINE_KAFKA_MAX_EMPTY_POLLS_BEFORE_FINISH:3}
engine.kafka.security-protocol=${ENGINE_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
engine.kafka.sasl-mechanism=${ENGINE_KAFKA_SASL_MECHANISM:}
engine.kafka.sasl-jaas-config=${ENGINE_KAFKA_SASL_JAAS_CONFIG:}
engine.kafka.truststore-location=${ENGINE_KAFKA_TRUSTSTORE_LOCATION:}
engine.kafka.truststore-password=${ENGINE_KAFKA_TRUSTSTORE_PASSWORD:}
engine.kafka.truststore-type=${ENGINE_KAFKA_TRUSTSTORE_TYPE:PKCS12}
engine.kafka.keystore-location=${ENGINE_KAFKA_KEYSTORE_LOCATION:}
engine.kafka.keystore-password=${ENGINE_KAFKA_KEYSTORE_PASSWORD:}
engine.kafka.key-password=${ENGINE_KAFKA_KEY_PASSWORD:}
engine.kafka.keystore-type=${ENGINE_KAFKA_KEYSTORE_TYPE:PKCS12}
engine.kafka.source.security-protocol=${ENGINE_KAFKA_SOURCE_SECURITY_PROTOCOL:}
engine.kafka.source.sasl-mechanism=${ENGINE_KAFKA_SOURCE_SASL_MECHANISM:}
engine.kafka.source.sasl-jaas-config=${ENGINE_KAFKA_SOURCE_SASL_JAAS_CONFIG:}
engine.kafka.source.truststore-location=${ENGINE_KAFKA_SOURCE_TRUSTSTORE_LOCATION:}
engine.kafka.source.truststore-password=${ENGINE_KAFKA_SOURCE_TRUSTSTORE_PASSWORD:}
engine.kafka.source.truststore-type=${ENGINE_KAFKA_SOURCE_TRUSTSTORE_TYPE:}
engine.kafka.source.keystore-location=${ENGINE_KAFKA_SOURCE_KEYSTORE_LOCATION:}
engine.kafka.source.keystore-password=${ENGINE_KAFKA_SOURCE_KEYSTORE_PASSWORD:}
engine.kafka.source.key-password=${ENGINE_KAFKA_SOURCE_KEY_PASSWORD:}
engine.kafka.source.keystore-type=${ENGINE_KAFKA_SOURCE_KEYSTORE_TYPE:}
engine.kafka.target.security-protocol=${ENGINE_KAFKA_TARGET_SECURITY_PROTOCOL:}
engine.kafka.target.sasl-mechanism=${ENGINE_KAFKA_TARGET_SASL_MECHANISM:}
engine.kafka.target.sasl-jaas-config=${ENGINE_KAFKA_TARGET_SASL_JAAS_CONFIG:}
engine.kafka.target.truststore-location=${ENGINE_KAFKA_TARGET_TRUSTSTORE_LOCATION:}
engine.kafka.target.truststore-password=${ENGINE_KAFKA_TARGET_TRUSTSTORE_PASSWORD:}
engine.kafka.target.truststore-type=${ENGINE_KAFKA_TARGET_TRUSTSTORE_TYPE:}
engine.kafka.target.keystore-location=${ENGINE_KAFKA_TARGET_KEYSTORE_LOCATION:}
engine.kafka.target.keystore-password=${ENGINE_KAFKA_TARGET_KEYSTORE_PASSWORD:}
engine.kafka.target.key-password=${ENGINE_KAFKA_TARGET_KEY_PASSWORD:}
engine.kafka.target.keystore-type=${ENGINE_KAFKA_TARGET_KEYSTORE_TYPE:}

engine.kafka.pipelines.application.source-topic=${ENGINE_KAFKA_PIPELINE_APPLICATION_SOURCE_TOPIC:application-restore-source}
engine.kafka.pipelines.application.target-topic=${ENGINE_KAFKA_PIPELINE_APPLICATION_TARGET_TOPIC:application-restore-target}
engine.kafka.pipelines.application.group-id=${ENGINE_KAFKA_PIPELINE_APPLICATION_GROUP_ID:application-restore-group}
engine.kafka.pipelines.application.transactional-id=${ENGINE_KAFKA_PIPELINE_APPLICATION_TRANSACTIONAL_ID:application-restore-tx-producer}

engine.kafka.pipelines.abuse.source-topic=${ENGINE_KAFKA_PIPELINE_ABUSE_SOURCE_TOPIC:abuse-restore-source}
engine.kafka.pipelines.abuse.target-topic=${ENGINE_KAFKA_PIPELINE_ABUSE_TARGET_TOPIC:abuse-restore-target}
engine.kafka.pipelines.abuse.group-id=${ENGINE_KAFKA_PIPELINE_ABUSE_GROUP_ID:abuse-restore-group}
engine.kafka.pipelines.abuse.transactional-id=${ENGINE_KAFKA_PIPELINE_ABUSE_TRANSACTIONAL_ID:abuse-restore-tx-producer}

engine.kafka.pipelines.notification.source-topic=${ENGINE_KAFKA_PIPELINE_NOTIFICATION_SOURCE_TOPIC:notification-restore-source}
engine.kafka.pipelines.notification.target-topic=${ENGINE_KAFKA_PIPELINE_NOTIFICATION_TARGET_TOPIC:notification-restore-target}
engine.kafka.pipelines.notification.group-id=${ENGINE_KAFKA_PIPELINE_NOTIFICATION_GROUP_ID:notification-restore-group}
engine.kafka.pipelines.notification.transactional-id=${ENGINE_KAFKA_PIPELINE_NOTIFICATION_TRANSACTIONAL_ID:notification-restore-tx-producer}

engine.s3.bucket=${ENGINE_S3_BUCKET:restore-default-bucket}
engine.s3.endpoint=${ENGINE_S3_ENDPOINT:}
engine.s3.region=${ENGINE_S3_REGION:eu-west-1}
engine.s3.access-key=${ENGINE_S3_ACCESS_KEY:}
engine.s3.secret-key=${ENGINE_S3_SECRET_KEY:}
engine.s3.path-style-access=${ENGINE_S3_PATH_STYLE_ACCESS:false}
engine.s3.connection-timeout=${ENGINE_S3_CONNECTION_TIMEOUT:PT5S}
engine.s3.read-timeout=${ENGINE_S3_READ_TIMEOUT:PT30S}

engine.zookeeper.connect-string=${ENGINE_ZOOKEEPER_CONNECT_STRING:localhost:2181}
engine.zookeeper.session-timeout=${ENGINE_ZOOKEEPER_SESSION_TIMEOUT:PT30S}
engine.zookeeper.connection-timeout=${ENGINE_ZOOKEEPER_CONNECTION_TIMEOUT:PT10S}
engine.zookeeper.command-processor-path=${ENGINE_ZOOKEEPER_COMMAND_PROCESSOR_PATH:/restore-engine/command-processor}
engine.zookeeper.command-processor-key=${ENGINE_ZOOKEEPER_COMMAND_PROCESSOR_KEY:restore-engine}
